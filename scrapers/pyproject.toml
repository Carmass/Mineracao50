[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineracao-scrapers"
version = "1.0.0"
description = "Web scrapers for product mining platform"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.48.0",
  "scrapy==2.11.2",
  "beautifulsoup4==4.12.3",
  "httpx==0.27.2",
  "celery==5.4.0",
  "redis==5.2.0",
  "supabase==2.9.1",
  "openai==1.55.0",
  "pydantic==2.10.1",
  "python-dotenv==1.0.1",
  "fake-useragent==1.5.1",
  "undetected-chromedriver==3.5.5",
  "selenium==4.26.1",
  "Pillow==11.0.0",
  "pytesseract==0.3.13",
  "deep-translator==1.11.4",
  "sentry-sdk==2.19.0",
  "loguru==0.7.2",
  "tenacity==9.0.0",
  "aiohttp==3.11.9",
  "lxml==5.3.0",
  "numpy==2.1.3",
  "scikit-learn==1.5.2",
]

[project.scripts]
scraper = "scrapers.cli:main"
worker = "scrapers.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["scrapers"]
